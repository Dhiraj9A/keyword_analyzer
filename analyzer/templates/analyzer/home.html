<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Website Keyword Analyzer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(circle at top left, #2563eb 0%, transparent 35%),
                radial-gradient(circle at bottom right, #7c3aed 0%, transparent 35%),
                #0f172a;

            color: #ffffff;
        }

        /* MAIN CARD */

        body > * {
            position: relative;
        }

        h1,
        p,
        form {
            position: relative;
        }

        body {
            flex-direction: column;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa,
                #c084fc
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #cbd5e1;
            font-size: 16px;
            margin-bottom: 28px;
            text-align: center;
        }

        form {
            width: 100%;
            max-width: 650px;

            padding: 35px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 20px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.35);

            display: flex;
            gap: 12px;
        }

        input[type="url"] {
            flex: 1;

            height: 52px;

            padding: 0 18px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 10px;

            outline: none;

            background: rgba(15, 23, 42, 0.75);

            color: #ffffff;

            font-size: 15px;

            transition: 0.3s ease;
        }

        input[type="url"]::placeholder {
            color: #94a3b8;
        }

        input[type="url"]:focus {
            border-color: #60a5fa;

            box-shadow:
                0 0 0 3px rgba(96, 165, 250, 0.15);

            background: rgba(15, 23, 42, 0.95);
        }

        button {
            height: 52px;

            padding: 0 26px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;
            font-weight: 600;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.3);

            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(124, 58, 237, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* ERROR MESSAGE */

        p[style*="color:red"] {
            max-width: 650px;
            width: 100%;

            padding: 12px 16px;

            margin-bottom: 20px;

            border-radius: 8px;

            background: rgba(239, 68, 68, 0.12);

            border: 1px solid rgba(239, 68, 68, 0.3);

            color: #fca5a5 !important;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 14px;
            }

            form {
                flex-direction: column;
                padding: 25px;
            }

            input[type="url"],
            button {
                width: 100%;
            }

            button {
                margin-top: 2px;
            }
        }

    </style>

</head>

<body>

    <h1>Website Keyword Analyzer</h1>

    <p>
        Enter any website URL to extract keywords.
    </p>

    {% if error %}
        <p style="color:red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST" action="{% url 'analyze_url' %}">

        {% csrf_token %}

        <input
            type="url"
            name="url"
            placeholder="https://example.com"
            required
        >

        <button type="submit">
            Analyze Website
        </button>

    </form>

</body>

</html>
